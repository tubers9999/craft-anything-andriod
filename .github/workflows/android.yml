name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27b
          add-to-path: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo & Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Install cargo-apk
        run: |
          which cargo-apk || cargo install cargo-apk

      - name: Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_APK_RELEASE_KEYSTORE: ${{ github.workspace }}/apps/craft-anything-android/release.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: craftanything
          RUST_BACKTRACE: 1
        run: |
          if [ ! -f apps/craft-anything-android/release.keystore ]; then
            keytool -genkeypair -v -keystore apps/craft-anything-android/release.keystore \
              -alias craftanything -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass craftanything -keypass craftanything \
              -dname "CN=CraftAnything, OU=RedGlitchX, O=RedGlitchX, L=Unknown, ST=Unknown, C=US"
          fi
          cargo apk build --release -p craft-anything-android

          mkdir -p dist

          # Locate Android build tools (zipalign and apksigner)
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build-tools from: $BUILD_TOOLS_DIR"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          # Target the aligned APK generated by cargo-apk, strictly ignoring temporary -unaligned.apk files!
          RAW_APK=$(find target/release/apk -name "*.apk" ! -name "*-unaligned.apk" | head -n 1)
          echo "Source APK: $RAW_APK"

          # 4-byte zip alignment
          $ZIPALIGN -f -p 4 "$RAW_APK" dist/craft-anything-andriod-aligned.apk
          $ZIPALIGN -c -v 4 dist/craft-anything-andriod-aligned.apk

          # Explicitly sign with v1 (JAR signing), v2, and v3 schemes using release keystore
          $APKSIGNER sign \
            --ks apps/craft-anything-android/release.keystore \
            --ks-pass pass:craftanything \
            --ks-key-alias craftanything \
            --key-pass pass:craftanything \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out dist/craft-anything-andriod.apk \
            dist/craft-anything-andriod-aligned.apk

          # Strictly verify the signature
          echo "Verifying APK signatures:"
          $APKSIGNER verify --verbose dist/craft-anything-andriod.apk

          # Dump APK badging to ensure package metadata is valid
          $BUILD_TOOLS_DIR/aapt dump badging dist/craft-anything-andriod.apk

          echo "Final built APK size:"
          ls -lh dist/craft-anything-andriod.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: craft-anything-andriod-apk
          path: dist/craft-anything-andriod.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.6-android
          name: "Craft Anything Android v0.4.6 (RedGlitchX Edition)"
          files: dist/craft-anything-andriod.apk
          draft: false
          prerelease: false
          body: |
            ## 📱 Craft Anything Android APK (v0.4.6)

            Official automated Android release build by **RedGlitchX**.

            ### 🚀 What's New in v0.4.6:
            - **Start Fresh with Unity, Rust & Godot**:
              - When starting fresh ("Nothing — start fresh"), you can now directly choose game engines (Unity, Rust + Macroquad, Godot, Unreal Engine) with a single tap.
              - Keywords like `unity`, `rust`, `godot`, `unreal`, `game`, `joc` (Romanian) are now properly recognized in fresh project prompts.
              - On Android, project initialization no longer gets blocked by missing desktop engine installer dialogs; the AI coding agent directly generates all Unity C# scripts, Rust Cargo projects, and Godot scene/GDScript files.
            - **Custom Image Generation API (OpenAI / Local SD / ComfyUI / DALL-E)**:
              - In addition to Fal.ai, you can now configure custom image generation endpoints (OpenAI DALL-E 3, Stable Diffusion, ComfyUI, LocalAI, Ollama).
              - Key input accepts standard OpenAI keys, custom endpoint addresses (e.g. `http://192.168.1.50:5000/v1`), or `key@http://endpoint`.
              - Supports both Base64 (`b64_json`) and URL image outputs.

            - **Author & Android Port:** RedGlitchX ([@tubers9999](https://github.com/tubers9999))
            - **Original Project:** ArtCraft Team & Craft Anything contributors
            - **License:** Dual-licensed MIT / Apache 2.0
            - **Target Architecture:** `aarch64-linux-android` (ARM64)
            - **Min Android SDK:** Android 8.0+ (API 26)
            - **Signatures:** v1 (JAR) + v2 (APK Signature v2) + v3 (APK Signature v3)
            - **Alignment:** 4-byte page aligned (zipalign)

            ### ✨ Previous v0.4.5 Highlights:
            - **XML Tool Call Parser for Local & Custom Models**: Fully parses `<tool_call>`, `<function=...>`, and `<parameter name="...">` tags emitted by Hermes, Qwen, DeepSeek, and Mythox AI models.
            - **Portrait Mobile Title Bar Overlap Fix**: Completely resolved text collisions and button overlap on portrait mobile screens.

            ### ⬇️ Download APK
            - **[craft-anything-andriod.apk](https://github.com/${{ github.repository }}/releases/download/v0.4.6-android/craft-anything-andriod.apk)**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
