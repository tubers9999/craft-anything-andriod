name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27b
          add-to-path: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo & Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Install cargo-apk
        run: |
          which cargo-apk || cargo install cargo-apk

      - name: Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          RUST_BACKTRACE: 1
        run: |
          cargo apk build --release -p craft-anything-android
          mkdir -p dist
          find target -name "*.apk" -exec cp {} dist/craft-anything-andriod.apk \;
          echo "Built APK size:"
          ls -lh dist/craft-anything-andriod.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: craft-anything-andriod-apk
          path: dist/craft-anything-andriod.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0-android
          name: "Craft Anything Android v0.4.0 (RedGlitchX Edition)"
          files: dist/craft-anything-andriod.apk
          draft: false
          prerelease: false
          body: |
            ## 📱 Craft Anything Android APK (v0.4.0)

            Official automated Android release build.

            - **Author & Android Port:** RedGlitchX ([@tubers9999](https://github.com/tubers9999))
            - **Target Architecture:** `aarch64-linux-android` (ARM64)
            - **Min Android SDK:** Android 8.0+ (API 26)

            ### ⬇️ Download APK
            - **[craft-anything-andriod.apk](https://github.com/${{ github.repository }}/releases/download/v0.4.0-android/craft-anything-andriod.apk)**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
