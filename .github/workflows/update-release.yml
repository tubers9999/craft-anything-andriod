name: Update Release Notes

on:
  push:
    paths:
      - 'RELEASE_NOTES.md'
      - '.github/workflows/update-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list -R ${{ github.repository }} --limit 1 | awk '{print $1}')
          if [ -n "$TAG" ]; then
            echo "Updating release $TAG with RELEASE_NOTES.md"
            gh release edit "$TAG" -R ${{ github.repository }} --notes-file RELEASE_NOTES.md
          fi
